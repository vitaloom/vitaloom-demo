version: '3.8'

services:
  mongodb:
    image: mongo:8.0.29-noble
    container_name: vitaloom_mongodb_srv
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-secret}

      APP_DB: ${APP_DB}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

      # Mount init script to initialize the application database user.
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vitaloom-network

  mongo-express:
    image: mongo-express:1.0.2-18-alpine3.19
    container_name: vitaloom_mongo_express_ui
    restart: unless-stopped
    ports:
      - "${ME_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASIC_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASIC_PASS:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vitaloom-network

  nginx:
    image: nginx:stable-alpine
    container_name: vitaloom_nginx_gateway
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # The Spring Boot app currently runs on the host, not in this Compose stack.
    # host-gateway also makes host.docker.internal available on Linux Docker Engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vitaloom-network

volumes:
  mongodb_data:
    name: vitaloom_data
  mongodb_config:
    name: vitaloom_config

networks:
  vitaloom-network:
    name: vitaloom-network
    driver: bridge
